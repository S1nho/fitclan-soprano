<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата абонемента</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-payment">

    <div class="header">
        <div class="header-container">
            <div></div>
            <h1 class="hero-title">FIT-CLAN SOPRANO</h1>
            <a href="{{ url_for('register') }}"><button>Личный кабинет</button></a>
        </div>
    </div>

    
    <main class="payment-main">
        <a class="back-link" href="{{ url_for('abonements') }}">Все абонементы</a>
        <div class="payment-header">
            <h1>Оплата абонемента</h1>
        </div>
        
        <section class="payment-card" aria-labelledby="plan-title">
            <div class="payment-card-header">
                <h2 id="plan-title">{{ plan.name }}</h2>
            </div>
            <div class="payment-card-body">
                <p class="payment-price">{{ plan.price }}₽<span> за {{ plan.duration }}</span></p>
                <form action="{{ url_for('payment_success') }}" method="post">
                    <button class="pay-button" type="submit">Оплатить абонемент</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>

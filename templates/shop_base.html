<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %} — FIT-CLAN SOPRANO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-shop">
    <header class="header">
        <div class="header-container">
            <div></div>
            <a href="{{ url_for('index') }}" style="text-decoration: none;">
                <h1 class="hero-title">FIT-CLAN SOPRANO</h1>
            </a>
            <a href="{{ url_for('account_click') }}">
                <button type="button">Личный кабинет</button>
            </a>
        </div>
    </header>
    <main class="shop-main">{% block content %}{% endblock %}</main>
</body>
</html>

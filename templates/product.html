{% extends 'shop_base.html' %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<a class="shop-back" href="{{ url_for('shop') }}">← Все товары</a>
<article class="shop-card shop-detail">
    <p class="shop-eyebrow">{{ product.category }}</p>
    <h1>{{ product.name }}</h1>
    <p>{{ product.description }}</p>
    <p class="shop-price">{{ '{:,}'.format(product.price).replace(',', ' ') }} ₽</p>
    <a class="shop-button" href="{{ url_for('payment_page', plan_id='product-' ~ product.id) }}">К оформлению</a>
</article>
{% endblock %}

<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>Регистрация</title>
        <link href="https://googleapis.com" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/registration.css') }}">
        <title>Регистрация</title>
    </head>
    <body>
        <div class="wrapper">
           <form action="">
               <h1 class="registration-title">Регистрация</h1>
               <div class="input-box">
               <input type="text" name="name" minlength="2" maxlength="50" placeholder="Имя" required>
               </div>

               <div class="input-box">
                   <input type="email" name="email" placeholder="Почта" required>
               </div>

               <div class="input-box">
                   <input type="password" name="password"
       minlength="8"
       pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
       title="Пароль должен быть не менее 8 символов и содержать как минимум одну латинскую букву и одну цифру"
       placeholder="Пароль"
       required>
               </div>

               <div class="gender-box">
    <span class="gender-title">Пол:</span>
    <div class="gender-inputs">
        <label class="gender-label">

            <input type="radio" name="gender" value="male" required>
            <span class="custom-radio"></span> Мужской
        </label>
        <label class="gender-label">

            <input type="radio" name="gender" value="female" required>
            <span class="custom-radio"></span> Женский
        </label>
    </div>
</div>

               <button type="submit" class="btn">Зарегестрироваться</button>

               <div class="login-link">
                   <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
               </div>
           </form>

        </div>

    </body>

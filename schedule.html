<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расписание — Фитнес-клуб</title>
    <style>
        body {
            background-color: #07240F;
            color: #D9FCED;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h1 {
            color: #09BBCB;
            border-bottom: 3px solid #405FFA;
            padding-bottom: 10px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th {
            background-color: #405FFA;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border: 1px solid #3D3664;
            color: #D9FCED;
        }

        tr:hover {
            background-color: #3B3664;
        }
    </style>
</head>
<body>

    <h1>Расписание фитнес-клуба</h1>
    <p>Клуб работает ежедневно с <strong>8:00 до 23:00</strong>. Занятия проходят в <strong>14:00</strong> и <strong>19:00</strong>.</p>

    <table>
        <tr>
            <th>День</th>
            <th>14:00</th>
            <th>19:00</th>
        </tr>
        <tr>
            <td>Понедельник</td>
            <td>Силовая</td>
            <td>Плавание</td>
        </tr>
        <tr>
            <td>Вторник</td>
            <td>Пилатес</td>
            <td>Бокс</td>
        </tr>
        <tr>
            <td>Среда</td>
            <td>Силовая</td>
            <td>Плавание</td>
        </tr>
        <tr>
            <td>Четверг</td>
            <td>Пилатес</td>
            <td>Бокс</td>
        </tr>
        <tr>
            <td>Пятница</td>
            <td>Силовая</td>
            <td>Плавание</td>
        </tr>
        <tr>
            <td>Суббота</td>
            <td>Пилатес</td>
            <td>Бокс</td>
        </tr>
    </table>

</body>
</html>
